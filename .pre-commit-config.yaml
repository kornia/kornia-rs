repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: fix-byte-order-marker
    - id: check-case-conflict
    - id: check-merge-conflict
    - id: check-symlinks
    - id: check-yaml
    - id: end-of-file-fixer
      exclude: '^(crates/kornia-imgproc/tests/data/opencv_resize/.*\.(src|dst)|\.claude/skills/.*/evals/.*\.diff)$'
    - id: mixed-line-ending
      exclude: '^(crates/kornia-imgproc/tests/data/opencv_resize/.*\.(src|dst)|\.claude/skills/.*/evals/.*\.diff)$'
    - id: trailing-whitespace
      exclude: '^(crates/kornia-imgproc/tests/data/opencv_resize/.*\.(src|dst)|\.claude/skills/.*/evals/.*\.diff)$'
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
    - id: fmt
  - repo: local
    hooks:
    - id: changelog-fragments
      name: changelog.d fragments are valid
      entry: python3 scripts/changelog.py preview
      language: system
      files: ^(changelog\.d/|scripts/changelog\.py$)
      pass_filenames: false
    - id: check-skills
      name: agent skills are valid and match the facts they restate
      entry: python3 scripts/check_skills.py
      language: system
      files: ^(\.claude/skills/|AGENTS\.md$|CONTRIBUTING\.md$|pixi\.toml$|Cargo\.toml$|crates/[^/]+/Cargo\.toml$|scripts/(release_rust\.sh|check_skills\.py)$|\.github/)
      pass_filenames: false
    - id: check-version-pins
      name: workspace dependency pins match workspace.package.version
      entry: python3 scripts/check_version_pins.py
      language: system
      files: ^Cargo\.toml$
      pass_filenames: false
    - id: check-release-coverage
      name: every publishable crate is in scripts/release_rust.sh
      entry: bash scripts/release_rust.sh --check
      language: system
      files: ^(Cargo\.toml|crates/[^/]+/Cargo\.toml|scripts/release_rust\.sh)$
      pass_filenames: false
