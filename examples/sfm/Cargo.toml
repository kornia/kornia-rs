[package]
name = "sfm"
version = { workspace = true }
edition = { workspace = true }
publish = false

[dependencies]
argh = { workspace = true }
cudarc = { workspace = true, optional = true }
kiddo = { workspace = true }
kornia-3d = { workspace = true }
kornia-algebra = { workspace = true }
kornia-calib = { workspace = true }
kornia-image = { workspace = true }
kornia-imgproc = { workspace = true }
kornia-io = { workspace = true, features = ["gstreamer"] }
rayon = { workspace = true }
rerun = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# CUDA is opt-in so a plain `cargo build/clippy --workspace` does not enable
# kornia-imgproc's `cuda` (and kornia-oxide-kernels' PTX) for every member.
[features]
cuda = ["kornia-imgproc/cuda", "dep:cudarc"]
