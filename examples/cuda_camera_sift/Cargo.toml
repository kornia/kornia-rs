[package]
name = "cuda-camera-sift"
version = "0.1.0"
authors = ["Edgar Riba <edgar.riba@gmail.com>"]
license = "Apache-2.0"
edition = "2021"
publish = false

[[bin]]
name = "cuda-camera-sift"
path = "src/main.rs"
required-features = ["cuda"]

[dependencies]
argh = { workspace = true }
cudarc = { version = "0.19", default-features = false, features = [
  "cuda-version-from-build-system",
  "driver",
  "fallback-dynamic-loading",
  "fallback-latest",
  "nvrtc",
  "std",
] }
kornia-image = { path = "../../crates/kornia-image", features = ["cuda"] }
kornia-imgproc = { path = "../../crates/kornia-imgproc" }
kornia-io = { path = "../../crates/kornia-io", features = ["v4l"] }
kornia-tensor = { path = "../../crates/kornia-tensor", features = ["cuda"] }

# kornia-imgproc's `cuda` needs kornia-oxide-kernels' PTX, which a checkout
# builds with cuda-oxide (docs/cuda-oxide.md), so workspace builds skip this.
[features]
cuda = ["kornia-imgproc/cuda"]
