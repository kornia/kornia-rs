version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # kiddo 6's build script crashes on native aarch64 Windows; see the
      # kiddo entry in the root Cargo.toml.
      - dependency-name: "kiddo"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-updates:
        patterns:
          - "*"

  # Keeps SHA-pinned actions (and their `# vX.Y.Z` comments) up to date,
  # including the local composite actions under .github/actions/.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "monthly"
    groups:
      action-updates:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/kornia-py"
    schedule:
      interval: "weekly"
    groups:
      pip-updates:
        patterns:
          - "*"
