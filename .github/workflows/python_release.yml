name: Python Release

on:
  workflow_dispatch:

permissions:
  contents: read

# env:
#   REGISTRY: ghcr.io
#   IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build steps live in python_wheels.yml, shared with `Python Release
  # Validation` -- run that first, it builds the same way and never publishes.
  wheels:
    uses: ./.github/workflows/python_wheels.yml
    with:
      subset: full

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: wheels
    # Only publish from main or a v* release tag. Configure required reviewers
    # / deployment branch rules for the `pypi` environment in repo settings.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/kornia-rs/
    # TODO: migrate to PyPI Trusted Publishing (OIDC) once configured on the
    # PyPI side (https://docs.pypi.org/trusted-publishers/): grant
    # `permissions: id-token: write` on this job, drop MATURIN_PYPI_TOKEN and
    # remove the PYPI_PASSWORD secret.
    steps:
      - run: sudo apt-get update
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-wheels"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.9
      - name: Publish to PyPi
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_PASSWORD }}
        uses: messense/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: upload
          args: --skip-existing *-wheels/*
