name: PR Validation

on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  validate:
    name: Validate PR Requirements
    runs-on: ubuntu-latest
    steps:
      # No checkout: this job runs under pull_request_target with a write token,
      # and the script below only uses the GitHub API (never the PR's files).
      - name: Validate PR requirements
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const prBody = pr.body || '';
            const prAuthor = pr.user.login;

            // Extract issue numbers from PR description
            // Matches patterns like: Fixes #123, Closes #456, Relates to #789, etc.
            const issuePattern = /(?:fixes?|closes?|resolves?|relates?\s+to|see|refs?)\s+#(\d+)/gi;
            // Ignore template comments so placeholder text never counts as a link.
            const matches = [...prBody.replace(/<!--[\s\S]*?-->/g, '').matchAll(issuePattern)];
            // Cap the number of issues checked to bound API calls on crafted PR bodies.
            const MAX_ISSUES = 5;
            const issueNumbers = [...new Set(matches.map(m => parseInt(m[1], 10)))].slice(0, MAX_ISSUES);

            const warnings = [];

            if (issueNumbers.length === 0) {
              warnings.push('❌ **No linked issue found**: This PR does not reference any issue. Please link to an issue using "Fixes #123" or "Closes #123" in the PR description.');
            } else {
              // Check each linked issue
              for (const issueNumber of issueNumbers) {
                try {
                  const issue = await github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber
                  });

                  if (issue.data.state === 'closed') {
                    warnings.push(`⚠️ **Issue #${issueNumber} is closed**: The linked issue #${issueNumber} is already closed. Please ensure you're linking to the correct issue.`);
                  }

                } catch (error) {
                  if (error.status === 404) {
                    warnings.push(`❌ **Issue #${issueNumber} not found**: The linked issue #${issueNumber} does not exist. Please check the issue number.`);
                  } else {
                    warnings.push(`⚠️ **Error checking issue #${issueNumber}**: ${error.message}`);
                  }
                }
              }
            }

            // Disclosure presence checks (warnings only). They check that fields are
            // filled in, not that what they say is true; review does that.
            // No AI categories (cf. kornia#4004): Agent `none` means no AI; otherwise
            // every field is required. Human vs AI part is always required.
            const body = prBody.replace(/<!--[\s\S]*?-->/g, '');
            const field = f => {
              const esc = f.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const m = body.match(new RegExp(`\\*\\*${esc}:\\*\\*[ \\t]*([^\\n]*)`));
              return m ? m[1].replace(/^\([^)]*\)$/, '').trim() : '';
            };
            const agent = field('Agent + version');
            const required = /^none\b/i.test(agent)
              ? ['Agent + version', 'Human vs AI part']
              : ['Agent + version', 'Model', 'Effort level', 'Skills applied', 'Human vs AI part'];
            const missing = required.filter(f => field(f) === '');
            if (missing.length > 0) {
              warnings.push(`⚠️ **AI disclosure incomplete**: fill in ${missing.map(f => `**${f}**`).join(', ')} (write \`none\` as the agent if no AI was used; see the PR template).`);
            }

            // Self-review is required and must be a real kornia-code-review run, so
            // maintainers can rely on it before reviewing by hand. These checks catch
            // placeholders and unaddressed findings, not a poor review; reviewers
            // judge that (kornia-code-review sections 6 and 7).
            const failures = [];
            const sr = body.match(/##[^\n]*Self-review[^\n]*\n([\s\S]*?)(?=\n## |$)/i);
            const srText = sr ? sr[1] : '';
            const verdict = (srText.match(/Verdict:[ \t]*(approve|request changes|comment)\b/i) || [])[1];
            const findings = srText.split('\n').filter(l => /\[(measured|inferred)\]/i.test(l));
            const blocking = findings.filter(l => /(^|\s)[—–-]+\s*blocking\s*[—–-]/i.test(l));
            const SKILL = '`.claude/skills/kornia-code-review/SKILL.md`';
            if (!verdict || !/Skill gaps:/i.test(srText)) {
              failures.push(`❌ **Self-review missing**: run the \`kornia-code-review\` skill on your diff and paste its output (with \`Verdict:\` and \`Skill gaps:\`) in the Self-review section. See ${SKILL}.`);
            } else if (findings.length === 0) {
              failures.push(`❌ **Self-review is a placeholder**: paste the skill's full output, one line per finding or checked section, each tagged \`[measured]\` or \`[inferred]\`. See ${SKILL}.`);
            } else if (blocking.length > 0) {
              failures.push(`❌ **Self-review has ${blocking.length} blocking finding(s)**: fix them, re-run the skill and paste the new output before a maintainer reviews.`);
            } else if (/request changes/i.test(verdict)) {
              failures.push('❌ **Self-review requests changes**: address its findings, re-run the skill and paste the new output before a maintainer reviews.');
            }

            // Library code needs the reuse search log (kornia-code-review section 0b).
            // Only file names are read through the API; the PR's code is never checked out.
            if (failures.length === 0) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, per_page: 100
              });
              const library = files.some(f => /^(crates\/|kornia-py\/src\/|kornia-cpp\/src\/)/.test(f.filename));
              const reuse = srText.match(/Reuse searches:([\s\S]*?)(?=\n\s*Skill gaps:|$)/i);
              if (library && !(reuse && /^\s*\$ /m.test(reuse[1]))) {
                failures.push(`❌ **Reuse searches missing**: this PR changes library code; the Self-review needs the \`Reuse searches\` block with the commands run and their hits. See ${SKILL} section 0b.`);
              }
            }
            warnings.unshift(...failures);

            // Post comment if there are warnings
            if (warnings.length > 0) {
              const commentBody = '## ⚠️ PR Validation Warnings\n\n' +
                warnings.join('\n\n') + '\n\n' +
                '---\n\n' +
                '**Note**: This PR can remain open, but please address these issues to ensure a smooth review process. For more information, see our [Contributing Guide](CONTRIBUTING.md).';

              // Check if we already posted a comment
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number
              });

              const botComment = comments.data.find(
                c => c.user && c.user.login === 'github-actions[bot]' && (c.body || '').includes('PR Validation Warnings')
              );

              if (botComment) {
                // Update existing comment
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: commentBody
                });
              } else {
                // Create new comment
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: commentBody
                });
              }
            } else {
              // Remove any existing warning comments if validation passes
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number
              });

              const botComment = comments.data.find(
                c => c.user && c.user.login === 'github-actions[bot]' && (c.body || '').includes('PR Validation Warnings')
              );

              if (botComment) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id
                });
              }
            }

            if (failures.length > 0) {
              core.setFailed('Required PR sections missing: ' + failures.length);
            }
