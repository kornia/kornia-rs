name: Issue Triage

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    name: Triage New Issue
    runs-on: ubuntu-latest
    steps:
      - name: Add triage label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['triage']
            });

      - name: Post welcome message
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const welcomeMessage = '## ⚠️ Before Submitting a PR\n\n' +
              'If you plan to work on this, say so here so others do not duplicate it, then link this issue from your PR. ' +
              'PRs need a pasted `kornia-code-review` self-review before a maintainer reviews them. ' +
              'See our [Contributing Guide](CONTRIBUTING.md) for details.';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: welcomeMessage
            });
