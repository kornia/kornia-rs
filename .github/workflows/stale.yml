name: Stale

on:
  schedule:
    - cron: "0 0 * * *" # Run daily at midnight UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Stale Pull Requests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10.4.0
        with:
          # PRs are labelled, never closed for inactivity: a quiet PR is often waiting
          # on review, and closing it bills our latency to the contributor (kornia#4629).
          stale-pr-message: "This pull request has had no activity for 15 days. If it is waiting on review, a maintainer will pick it up; if it is waiting on you, please push an update or say if you need help. It will not be closed automatically."
          days-before-pr-stale: 15
          days-before-pr-close: -1
          stale-pr-label: "stale"
          exempt-pr-labels: "pinned,work-in-progress,on-hold"
          days-before-issue-stale: -1
          days-before-issue-close: -1
