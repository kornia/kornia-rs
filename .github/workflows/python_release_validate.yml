name: Python Release Validation

# Dry run of `Python Release`: same build definition (python_wheels.yml), a
# minimal matrix, a smoke test of each wheel -- and no publish job at all.
# Label a PR `ci:wheels-full` to build the full release matrix instead.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - .cargo/config.toml
      - .github/workflows/python_release.yml
      - .github/workflows/python_release_validate.yml
      - .github/workflows/python_wheels.yml
      - kornia-py/**
      - scripts/cuda-oxide/**
      - crates/kornia-imgproc/build.rs
      - crates/kornia-imgproc/kernels-oxide/**
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (empty = the selected branch)"
        type: string
        default: ""
      subset:
        description: "minimal = py3.12 per platform; full = every release wheel"
        type: choice
        options: [minimal, full]
        default: minimal

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    # Other labels must not re-run the build.
    if: github.event.action != 'labeled' || github.event.label.name == 'ci:wheels-full'
    uses: ./.github/workflows/python_wheels.yml
    with:
      subset: ${{ inputs.subset || (contains(github.event.pull_request.labels.*.name, 'ci:wheels-full') && 'full') || 'minimal' }}
      ref: ${{ inputs.ref || '' }}
      retention-days: 3

  smoke:
    name: smoke (${{ matrix.artifact }})
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The py3.12 wheel per platform, in both subsets: `full` builds the
        # whole release matrix but does not install or test the other wheels.
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64-3.12-wheels
            tag: 'cp312-.*manylinux.*_x86_64\.whl$'
            cuda: "1"
          - os: ubuntu-24.04-arm
            artifact: linux-aarch64-3.12-wheels
            tag: 'cp312-.*manylinux.*_aarch64\.whl$'
            cuda: "1"
          - os: macos-15
            artifact: macos-aarch64-3.12-wheels
            tag: 'cp312-.*macosx_.*_arm64\.whl$'
            cuda: "0"
          - os: windows-latest
            artifact: windows-x64-3.12-wheels
            tag: 'cp312-.*win_amd64\.whl$'
            cuda: "0"
          # windows-arm64 installs and imports its wheel in the build job.
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: wheelhouse
      - name: Check wheel tags and metadata
        shell: bash
        env:
          TAG_RE: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(wheelhouse/*.whl)
          [ "${#wheels[@]}" -eq 1 ] || { echo "::error::expected 1 wheel, got: ${wheels[*]}"; exit 1; }
          whl=${wheels[0]}
          echo "$whl"
          [[ $(basename "$whl") =~ $TAG_RE ]] || { echo "::error::$whl does not match $TAG_RE"; exit 1; }
          python -m pip install -q twine
          python -m twine check "$whl"
          if [ "$RUNNER_OS" = Linux ]; then
            python -m pip install -q auditwheel
            auditwheel show "$whl"
          fi
      - name: Install in a clean venv and import
        shell: bash
        env:
          EXPECT_CUDA: ${{ matrix.cuda }}
        run: |
          set -euo pipefail
          # No checkout here, so nothing in the cwd can shadow the installed package.
          python -m venv .venv
          if [ "$RUNNER_OS" = Windows ]; then py=.venv/Scripts/python.exe; else py=.venv/bin/python; fi
          "$py" -m pip install -q numpy
          "$py" -m pip install --no-index --no-deps wheelhouse/*.whl
          "$py" - <<'EOF'
          import os
          from importlib.metadata import version

          import numpy as np
          import kornia_rs as K

          rgb = np.zeros((4, 6, 3), np.uint8)
          rgb[..., 0] = 255
          gray = np.asarray(K.imgproc.gray_from_rgb(rgb))
          assert gray.shape[:2] == (4, 6) and 70 <= int(gray.max()) <= 82, (gray.shape, gray.max())
          flat = np.full((8, 8, 3), 100, np.uint8)
          blur = np.asarray(K.imgproc.gaussian_blur(flat, (3, 3), (1.0, 1.0)))
          assert (blur == 100).all()

          cuda = getattr(K, "cuda", None)
          if os.environ["EXPECT_CUDA"] == "1":
              # --features cuda wheel: must import and answer on a GPU-less runner.
              assert cuda is not None, "kornia_rs.cuda missing from a cuda wheel"
              # Graph is registered only with `--features cuda`; is_available()
              # alone is False on a GPU-less runner either way.
              assert hasattr(cuda, "Graph"), "cuda wheel built without --features cuda"
              print("cuda.is_available():", cuda.is_available())
          print("kornia_rs", version("kornia_rs"), "OK")
          EOF
