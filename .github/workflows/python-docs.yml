name: python-docs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-docstrings:
    name: Verify Python Docstrings
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.73.0
          cache: true
          environments: dev

      - name: Build kornia_rs
        run: pixi run --environment dev py-build

      - name: Run Doctests
        run: pixi run --environment dev pytest tests/test_doctests.py
