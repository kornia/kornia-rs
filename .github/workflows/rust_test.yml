name: Rust Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "examples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust_test.yml"
  pull_request:
    branches:
      - main
    paths:
      - "crates/**"
      - "examples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust_test.yml"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # 20 min covers cold-cache rebuilds on aarch64 + release-x86_64. The
    # warm-cache runs (e.g. Test Debug - x86_64) finish in ~8 min, so the
    # extra budget only kicks in when sccache misses workspace-wide.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Test Debug - x86_64
            runner: ubuntu-latest
            command: rust-test
          - name: Test Release - x86_64
            runner: ubuntu-latest
            command: rust-test-release
          - name: Test Debug - aarch64
            runner: ubuntu-24.04-arm
            command: rust-test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust-cache

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.73.0
          cache: true

      - name: Run ${{ matrix.command }}
        run: pixi run ${{ matrix.command }}

      - name: Show sccache stats
        if: always()
        run: |
          sccache --show-stats 2>&1 || echo "::warning::sccache stats unavailable - server may have exited"
