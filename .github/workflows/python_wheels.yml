name: Python Wheels

# The wheel build matrix, shared by `Python Release` (full, then publish) and
# `Python Release Validation` (minimal, never publishes) so the two cannot drift.
# No secrets: this workflow only builds and uploads artifacts.
on:
  workflow_call:
    inputs:
      subset:
        description: "full = every release wheel; minimal = py3.12 on each platform"
        type: string
        default: full
      ref:
        description: "Git ref to build (empty = the caller's commit)"
        type: string
        default: ""
      retention-days:
        description: "Wheel artifact retention (0 = repository default)"
        type: number
        default: 0

permissions:
  contents: read

jobs:
  # `--features cuda` compiles kornia-imgproc's Rust CUDA kernels with cuda-oxide
  # (nightly + codegen backend + LLVM 21). Build that toolchain once, in a
  # manylinux2014 container so it runs in every wheel container (the aarch64
  # wheels cross-compile on an x86_64 host, so one x86_64 toolchain serves both).
  cuda-oxide-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .oxide-toolchain
          key: cuda-oxide-manylinux2014-x86_64-${{ hashFiles('crates/kornia-imgproc/kernels-oxide/rust-toolchain.toml', 'crates/kornia-imgproc/kernels-oxide/Cargo.toml.in', 'scripts/cuda-oxide/install-toolchain.sh', 'scripts/cuda-oxide/llvm-*.txt') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # The linker override neutralizes the repo's `.cargo/config.toml`, as
          # in the wheel job below (the backend builds under /io).
          docker run --rm -v "$PWD:/io" -w /io -e CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=cc \
            quay.io/pypa/manylinux2014_x86_64 \
            bash -c 'OXIDE_USE_SYSTEM=0 CARGO_BUILD_JOBS=4 scripts/cuda-oxide/install-toolchain.sh /io/.oxide-toolchain'
          sudo chown -R "$(id -u):$(id -g)" .oxide-toolchain

  linux:
    needs: cuda-oxide-toolchain
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.subset == 'minimal' && '["3.12"]' || '["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.13t", "3.14", "3.14t"]') }}
        target: [x86_64, aarch64]
    # Neutralize the in-repo `.cargo/config.toml` (which targets the local
    # Jetson cross-test setup: `x86_64-linux-gnu-gcc` cross-linker plus
    # `x86-64-v3` / `aarch64+fp16+fhm` baselines). Released wheels need
    # broad CPU compat: the binary boots on stock baselines and
    # `cpu_features()` selects NEON / AVX2 paths at runtime via per-fn
    # `#[target_feature]` annotations.
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ""
      # Manylinux containers ship `cc` / `gcc` but not the `x86_64-linux-gnu-gcc`
      # cross wrapper our config.toml uses for cross-builds from aarch64.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: cc
      # Keep `opt-level=2` for aarch64: works around an LLVM crash compiling
      # `faer` at opt-level=3 (BranchProbabilityInfo SIGSEGV). Drop the
      # `+fp16,+fhm` baseline so the wheel runs on pre-ARMv8.2 chips.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-Copt-level=2"

    steps:
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .oxide-toolchain
          key: cuda-oxide-manylinux2014-x86_64-${{ hashFiles('crates/kornia-imgproc/kernels-oxide/rust-toolchain.toml', 'crates/kornia-imgproc/kernels-oxide/Cargo.toml.in', 'scripts/cuda-oxide/install-toolchain.sh', 'scripts/cuda-oxide/llvm-*.txt') }}
          fail-on-cache-miss: true
      - uses: messense/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          # Pin maturin 1.13.3 — the version that shipped v0.1.14 and built the
          # whole matrix incl. free-threaded 3.13 (3.13t). Newer maturin sets
          # FREE_THREADED_MINIMUM_PYTHON_MINOR=14 and drops 3.13t (upstream
          # deprecated it for 3.14t), so `latest`/default fails 3.13t-linux with
          # "Free-threaded Python interpreter is only supported on 3.14 and
          # later". Revisit (unpin) if/when we move to 3.14t-only wheels.
          maturin-version: v1.13.3
          target: ${{ matrix.target }}
          manylinux: auto
          command: build
          before-script-linux: |
            if command -v dnf &> /dev/null; then dnf install cmake3 -y; elif command -v yum &> /dev/null; then yum install cmake3 -y; elif command -v apt-get &> /dev/null; then apt-get update && apt-get install cmake -y; else echo "None of dnf, yum, or apt found."; fi
            if command -v cmake3 &> /dev/null; then export CMAKE=cmake3; fi
            # Reuses the cached backend/LLVM/cuda.h; installs only the nightly here.
            OXIDE_USE_SYSTEM=0 scripts/cuda-oxide/install-toolchain.sh "$PWD/.oxide-toolchain"
            . "$PWD/.oxide-toolchain/env.sh"
          # --features cuda: ship GPU-capable linux wheels. cudarc uses
          # `fallback-dynamic-loading`, so the wheel builds in the CUDA-less
          # manylinux container and dlopens libcuda/libnvrtc at runtime — one
          # universal wheel that runs on CPU when no GPU/driver is present and
          # activates CUDA when it is. (macOS/Windows stay CPU-only: no NVIDIA.)
          # No --sdist: not self-contained (bindgen/vendored deps); wheels build
          # directly like the macOS/Windows jobs.
          args: --release --out dist -i python${{ matrix.python-version }} -m kornia-py/Cargo.toml --features cuda
      - name: Verify SIMD paths are present in the built wheel
        env:
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          set -e
          WHEEL=$(ls dist/*-manylinux*.whl 2>/dev/null | head -n1)
          [ -n "$WHEEL" ] || { echo "no manylinux wheel found"; exit 1; }
          mkdir -p /tmp/wheel-check && unzip -q -o "$WHEEL" -d /tmp/wheel-check
          SO=$(find /tmp/wheel-check -name 'kornia_rs*.so' | head -n1)
          [ -n "$SO" ] || { echo "no .so found in wheel"; exit 1; }
          if [ "$MATRIX_TARGET" = "x86_64" ]; then
            objdump -d --no-show-raw-insn "$SO" | grep -E 'vpand[^l]|vpcmpeq|vpaddb|vpsubusb' | head -n3 || \
              { echo "::error::no AVX2 instructions found in $SO"; exit 1; }
          else
            aarch64-linux-gnu-objdump -d --no-show-raw-insn "$SO" 2>/dev/null | grep -E '\bcnt v|\bvld3|\baddv ' | head -n3 || \
              { echo "::error::no NEON instructions found in $SO"; exit 1; }
          fi
          echo "SIMD presence confirmed in $WHEEL for target $MATRIX_TARGET"
          # Real cuda-oxide PTX, not the KORNIA_OXIDE_STUB empty string.
          grep -aq '\.entry gray_from_rgb_u8' "$SO" || \
            { echo "::error::cuda-oxide PTX missing from $SO"; exit 1; }
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.target }}-${{ matrix.python-version }}-wheels
          path: dist
          retention-days: ${{ inputs.retention-days }}

  macos:
    # Python 3.8-3.10 moved off macos-13: that pool is effectively
    # unschedulable in 2026; macos-14 serves 3.8+ and cross-builds x86_64.
    runs-on: macos-14
    strategy:
      matrix:
        python-version: ${{ fromJSON(inputs.subset == 'minimal' && '["3.12"]' || '["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.13t", "3.14", "3.14t"]') }}
        target: ${{ fromJSON(inputs.subset == 'minimal' && '["aarch64"]' || '["x86_64", "aarch64"]') }}
    steps:
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}-apple-darwin
      - uses: messense/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: v1.15.0
          args: --release --target ${{ matrix.target }}-apple-darwin --out dist -i python${{ matrix.python-version }} -m kornia-py/Cargo.toml
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.target }}-${{ matrix.python-version }}-wheels
          path: dist
          retention-days: ${{ inputs.retention-days }}

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ${{ fromJSON(inputs.subset == 'minimal' && '["3.12"]' || '["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.13t", "3.14", "3.14t"]') }}
        target: ${{ fromJSON(inputs.subset == 'minimal' && '["x64"]' || '["x64", "x86"]') }}
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          # x86 python needs to be available for the win32 wheel
          architecture: ${{ ( matrix.os == 'windows-latest' && matrix.target == 'i686' ) && 'x86' || null }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: |
          pip install cmake ninja
      - uses: messense/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: v1.15.0
          args: --release --out dist -i python${{ matrix.python-version }} -m kornia-py/Cargo.toml
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.target }}-${{ matrix.python-version }}-wheels
          path: dist
          retention-days: ${{ inputs.retention-days }}

  windows-arm64:
    name: py${{ matrix.python-version }}-windows-arm64
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        # CPython first published native Windows ARM64 installers in 3.11.
        python-version: ${{ fromJSON(inputs.subset == 'minimal' && '["3.12"]' || '["3.11", "3.12", "3.13", "3.14"]') }}
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: arm64
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: arm64
      - name: Install native build tools
        run: python -m pip install --upgrade cmake ninja
      - uses: messense/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: v1.15.0
          args: --release --target aarch64-pc-windows-msvc --out dist -i python${{ matrix.python-version }} -m kornia-py/Cargo.toml
      - name: Verify native ARM64 wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist\*-win_arm64.whl | Select-Object -First 1
          if (-not $wheel) { throw "No win_arm64 wheel was produced" }
          python -m pip install --force-reinstall $wheel.FullName
          python -c "import kornia_rs, platform; assert platform.machine().upper() == 'ARM64'; assert kornia_rs.cpu.cpu_features().has_neon; print(kornia_rs.cpu.cpu_features())"
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-arm64-${{ matrix.python-version }}-wheels
          path: dist
          retention-days: ${{ inputs.retention-days }}
