name: Rust Lint

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "examples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust_lint.yml"
  pull_request:
    branches:
      - main
    paths:
      - "crates/**"
      - "examples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust_lint.yml"

permissions:
  contents: read

jobs:
  lint:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Rustfmt
            command: rust-fmt-check
            needs-sccache: false
          - name: Clippy
            command: rust-clippy
            needs-sccache: true
          - name: Check
            command: rust-check
            needs-sccache: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust-cache
        with:
          with-sccache: ${{ matrix.needs-sccache }}

      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.73.0
          cache: true

      - name: Run ${{ matrix.name }}
        run: pixi run ${{ matrix.command }}

      - name: Show sccache stats
        if: always() && matrix.needs-sccache
        run: |
          sccache --show-stats 2>&1 || echo "::warning::sccache stats unavailable - server may have exited"

  cuda-feature-check:
    name: Check - CUDA features
    # Compile + clippy coverage for the CUDA-gated code on a GPU-less runner.
    # kornia's cudarc is built with `fallback-dynamic-loading`: libcuda.so is
    # dlopen'd at RUNTIME only, so nothing here needs a GPU; only the cuda-oxide
    # step needs cuda.h (headers + driver stub, no toolkit, no driver).
    # Kernel-execution tests run on real hardware (Jetson) outside CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Pinned to match the toolchain pixi provides for the `Clippy` job above
      # (`rust = ">=1.76"` currently resolves to 1.96). Tracking `stable` meant a
      # compiler release could introduce a lint and fail this job on every open
      # PR without any source change - Rust 1.98's `chunks_exact_to_as_chunks`
      # did exactly that. Bump this deliberately, together with pixi's rust pin.
      - uses: dtolnay/rust-toolchain@ebb3d1676050bfd0971c36c1e215b5751473994d # 1.96.0
        with:
          components: clippy

      - name: Clippy CUDA-gated crates (deny warnings)
        # `--tests` also compiles + lints the `#[cfg(test)]` cuda code. The tests
        # need a GPU to RUN (Jetson, outside CI), but compiling them here catches
        # API/signature rot in the device paths on a GPU-less runner.
        run: |
          cargo clippy --tests -p kornia-tensor --features cuda -- -D warnings
          cargo clippy --tests -p kornia-image --features cuda -- -D warnings
          cargo clippy --tests -p kornia-imgproc --features cuda -- -D warnings
          cargo clippy --tests -p kornia-3d --features cuda -- -D warnings

      # `cuda-oxide`: kornia-imgproc's build.rs compiles kernels-oxide/ to PTX and
      # gates it, so this really builds the kernels (no GPU needed). Needs LLVM
      # 21's llc, cuda.h + the libcuda stub, the pinned nightly, and the codegen
      # backend at the pinned rev (cached).
      - name: cuda-oxide toolchain
        run: |
          TC=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' kernels-oxide/rust-toolchain.toml)
          REV=$(sed -n 's/.*rev = "\([0-9a-f]*\)".*/\1/p' kernels-oxide/Cargo.toml | head -1)
          echo "OXIDE_TC=$TC" >> "$GITHUB_ENV"
          echo "OXIDE_REV=$REV" >> "$GITHUB_ENV"
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends llvm-21 cuda-driver-dev-12-6
          CUDA=/usr/local/cuda-12.6
          [ -f "$CUDA/include/cuda.h" ] || sudo ln -sfn targets/x86_64-linux/include "$CUDA/include"
          echo "CUDA_HOME=$CUDA" >> "$GITHUB_ENV"
          rustup toolchain install "$TC" --profile minimal -c rust-src,rustc-dev

      - name: Cache cuda-oxide backend
        id: oxide-backend
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/cuda-oxide/librustc_codegen_cuda.so
          key: cuda-oxide-backend-${{ runner.os }}-${{ env.OXIDE_TC }}-${{ env.OXIDE_REV }}

      - name: Build cuda-oxide backend
        if: steps.oxide-backend.outputs.cache-hit != 'true'
        run: |
          git init -q /tmp/cuda-oxide && cd /tmp/cuda-oxide
          git fetch -q --depth 1 https://github.com/NVlabs/cuda-oxide "$OXIDE_REV"
          git checkout -q FETCH_HEAD
          cd crates/rustc-codegen-cuda
          SYSROOT=$(rustup run "$OXIDE_TC" rustc --print sysroot)
          LIBRARY_PATH="$SYSROOT/lib" LD_LIBRARY_PATH="$SYSROOT/lib" rustup run "$OXIDE_TC" cargo build
          mkdir -p ~/.cargo/cuda-oxide
          cp target/debug/librustc_codegen_cuda.so ~/.cargo/cuda-oxide/

      - name: Clippy kornia-imgproc with cuda-oxide (builds + gates the PTX)
        run: cargo clippy --all-targets -p kornia-imgproc --features cuda,cuda-oxide -- -D warnings

  cross-platform-check-macos:
    name: Check - macOS
    # Pinned to macOS 15 (Sequoia) to avoid the macOS 26 (Tahoe) beta runner, where
    # the conda/pixi cxx-compiler clang fails to resolve libSystem symbols (___stderrp)
    # when building turbojpeg-sys's bundled libjpeg-turbo CLI tools.  When GitHub
    # promotes Tahoe to a stable runner and conda-forge catches up, revisit this pin.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.73.0
          cache: true

      - name: Run cargo check
        # The pixi/conda cxx-compiler has no SDKROOT, so its clang can't find the
        # macOS SDK / libSystem when building C/native deps from scratch (e.g.
        # turbojpeg-sys's bundled libjpeg-turbo). Point it at the Xcode SDK so the
        # C builds link libSystem (_fprintf/_malloc/etc.).
        run: |
          export SDKROOT="$(xcrun --show-sdk-path)"
          export CONDA_BUILD_SYSROOT="$SDKROOT"
          pixi run rust-check

  cross-platform-check-windows:
    name: Check - Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Run cargo check (core crates)
        run: cargo check
