name: Rust Yank

# Yank (or un-yank) one version of every crate that rust_release.yml publishes.
# Uses the same `crates-io` environment and CARGO_REGISTRY_TOKEN secret, so no
# maintainer needs a local token. A yank stops NEW lockfiles from resolving the
# version; existing lockfiles keep building. `undo` reverses it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version to yank, e.g. 0.1.15'
        required: true
      confirm:
        description: 'Type "yank" to confirm'
        required: true
        default: ''
      undo:
        description: 'Un-yank instead (cargo yank --undo)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  yank:
    name: cargo yank
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: crates-io
      url: https://crates.io/crates/kornia-image
    steps:
      - name: Guard — confirmation and version format
        env:
          CONFIRM: ${{ inputs.confirm }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$CONFIRM" != "yank" ]; then
            echo "::error::Confirmation field must be exactly 'yank' (got: '$CONFIRM')"
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$VERSION' is not a semver version"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Yank every published crate
        env:
          # crates.io tokens are scoped; a publish-only token gets 403 on yank. Prefer a
          # yank-scoped CARGO_YANK_TOKEN, else a CARGO_REGISTRY_TOKEN that also has `yank`.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_YANK_TOKEN || secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ inputs.version }}
          UNDO: ${{ inputs.undo }}
        run: |
          set -euo pipefail
          # Same crate set as the publish script, so the two cannot drift.
          crates=$(sed -n '/^PUBLISH_ORDER=(/,/^)/p' scripts/release_rust.sh | grep -oE 'kornia[a-z0-9-]*')
          flag=""; want=true
          if [ "$UNDO" = "true" ]; then flag="--undo"; want=false; fi
          for c in $crates; do
            cargo yank $flag --version "$VERSION" "$c"
          done
          # Verify on the registry: fail loudly if any crate did not end up in the wanted state.
          ua="kornia-rs yank workflow (https://github.com/kornia/kornia-rs)"
          bad=0
          for c in $crates; do
            state=$(curl -fsS --retry 3 -A "$ua" "https://crates.io/api/v1/crates/$c/$VERSION" \
              | python3 -c 'import sys,json; print(str(json.load(sys.stdin)["version"]["yanked"]).lower())')
            echo "$c $VERSION yanked=$state"
            [ "$state" = "$want" ] || bad=1
          done
          exit $bad
