name: GPU Sim

# Runs the CUDA-vs-CPU parity tests (the `#[cfg(all(test, feature = "cuda"))]`
# modules) on a simulated NVIDIA H100 (https://github.com/pantheongpu/pantheonsim),
# so they execute on a hosted runner instead of only compiling
# (rust_lint.yml `cuda-feature-check`). Opt-in: run it from the Actions tab or
# add the `ci:gpu-sim` label to a PR. A functional simulator checks results,
# not timing or hardware behaviour, so it complements the Jetson runs of
# scripts/cuda-oxide/orin-test-bench.sh and does not replace them.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 3
  CRATES: -p kornia-tensor -p kornia-image -p kornia-imgproc -p kornia-3d -p kornia-oxide-kernels
  FEATURES: kornia-tensor/cuda,kornia-image/cuda,kornia-imgproc/cuda,kornia-3d/cuda,kornia-oxide-kernels/cuda,kornia-oxide-kernels/ptx
  # Set explicitly so a missing PTX fails the build instead of building the
  # stub, with which the loader tests pass and gray_from_rgb_u8 runs on NVRTC.
  KORNIA_OXIDE_PTX: ${{ github.workspace }}/crates/kornia-oxide-kernels/kernels.ptx

jobs:
  cuda-tests:
    name: CUDA tests on a simulated H100
    # Labelling with another label must not start (or cancel) a run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'ci:gpu-sim') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'ci:gpu-sim'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Builds third-party code (the cuda-oxide backend) and never pushes.
          persist-credentials: false

      # Same pin as rust_lint.yml `cuda-feature-check`.
      - uses: dtolnay/rust-toolchain@ebb3d1676050bfd0971c36c1e215b5751473994d # 1.96.0

      # Before the build: cudarc reads the CUDA version from this toolkit.
      - name: Set up the simulated H100 and CUDA 13.0
        uses: pantheongpu/setup-pantheonsim@a1b9d4237411f9b2b0e0bb895b4d83377f336a7b # v0.1.9
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      # kernels.ptx is `.version 6.3` / `.target sm_75`; the simulator JIT-loads
      # it like a driver would. The NVRTC kernels compile for compute_90.
      - uses: ./.github/actions/cuda-oxide-ptx

      - name: Build tests
        run: cargo test --release --locked --no-run --lib $CRATES --features $FEATURES

      # The CUDA tests unwrap CudaContext::new(0), so a missing device fails them
      # rather than skipping. `requires a CUDA device` tests are #[ignore]d; run
      # them too. The other #[ignore]d tests are timing probes.
      - name: Run tests
        run: |
          set -o pipefail
          vgpu run cargo test --release --locked --lib $CRATES --features $FEATURES \
            -- --test-threads=4 2>&1 | tee "$RUNNER_TEMP/test.log"
          vgpu run cargo test --release --locked --lib $CRATES --features $FEATURES \
            -- --ignored preprocess::tests:: --test-threads=4 2>&1 | tee -a "$RUNNER_TEMP/test.log"

      # cargo skips targets with unmet features silently, so check names, not
      # only "ok" (the same checks as scripts/cuda-oxide/orin-test-bench.sh).
      - name: Check that the device tests ran
        run: |
          log="$RUNNER_TEMP/test.log"
          die() { echo "::error::$*"; exit 1; }
          grep -q "test result: FAILED" "$log" && die "tests failed"
          for t in load_ptx_many_entries_and_errors all_entries_load concurrent_calls_share_one_module; do
            grep -q "^test loader::tests::$t \.\.\. ok$" "$log" || die "$t did not pass"
          done
          mapfile -t entries < <(sed -n 's/.*\.entry \([A-Za-z0-9_]*\).*/\1/p' crates/kornia-oxide-kernels/kernels.ptx)
          ((${#entries[@]})) || die "no .entry in kernels.ptx"
          for e in "${entries[@]}"; do
            # The NVRTC-fallback test must not stand in for the oxide kernel's.
            n=$(grep -E "^test .*::${e}[a-z0-9_]*bit_exact \.\.\. ok$" "$log" | grep -vc nvrtc || true)
            ((n > 0)) || die "no passing ${e}*bit_exact test"
          done
          for m in 'cuda::tests::' 'cuda_parity::' 'cuda::color::' 'depth::cuda_tests::' 'voxel::cuda_tests::' \
                   'label_boundaries::cuda_tests::' 'preprocess::tests::(cuda_|cpu_close_to_cuda|f16_matches|pitched_surface)'; do
            n=$(grep -cE "^test .*${m}.* \.\.\. ok$" "$log" || true)
            ((n > 0)) || die "no passing test under ${m}"
            echo "${m} ${n} passed"
          done
          echo "#[ignore]d in the first run (timing probes, plus the preprocess tests run above): $(grep -c ' \.\.\. ignored' "$log" || true)"
