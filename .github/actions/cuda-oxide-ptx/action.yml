name: Build the cuda-oxide PTX
description: >
  Install the cuda-oxide toolchain (cached) and build
  crates/kornia-oxide-kernels/kernels.ptx, which the `ptx` feature reads and
  the published crate ships. Needs a checkout and a stable Rust toolchain.
runs:
  using: composite
  steps:
    - name: Cache cuda-oxide toolchain
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/kornia-cuda-oxide
        key: cuda-oxide-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/kornia-oxide-kernels/device/rust-toolchain.toml', 'crates/kornia-oxide-kernels/device/Cargo.toml.in', 'scripts/cuda-oxide/install-toolchain.sh', '.cargo/config.toml') }}
    - name: Install cuda-oxide toolchain
      shell: bash
      run: scripts/cuda-oxide/install-toolchain.sh ~/.cache/kornia-cuda-oxide
    - name: Build and gate the PTX
      shell: bash
      run: cargo run --locked -p kornia-oxide-kernels --example build_ptx
