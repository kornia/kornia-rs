# Vendored copy of yep-cache-line-size 0.9.3 (https://github.com/richkcho/cache-line-size),
# wired in through `[patch.crates-io]` in the workspace root. The only change is
# in src/arm.rs: on aarch64 Windows, `get_cache_line_size` returns
# `CacheInfoError::NotPresent` instead of reading `ctr_el0`. Windows does not let
# user mode read that register, so reading it raises STATUS_ILLEGAL_INSTRUCTION
# and crashes kiddo 6's build script in our wheel-windows-arm64 job. kiddo
# already falls back to 64-byte cache lines on `Err`. Drop this directory and the
# patch entry once upstream ships a fix.
[package]
name = "yep-cache-line-size"
version = "0.9.3"
edition = "2024"
description = "A small library for retrieving cache line sizes. Forked from lovesegfault/cache-size."
repository = "https://github.com/richkcho/cache-line-size"
license = "BSD-3-Clause"
publish = false

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
libc = "0.2"

[target.'cfg(target_arch = "x86_64")'.dependencies]
raw-cpuid = "11"

[target.'cfg(target_arch = "x86")'.dependencies]
raw-cpuid = "11"
