[package]
name = "kornia-3d"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "3d point cloud processing library"
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
categories = { workspace = true }
publish = true

[[bench]]
harness = false
name = "bench_linalg"

[[bench]]
harness = false
name = "bench_twoview"

[dependencies]
bincode = { workspace = true }
cudarc = { workspace = true, optional = true }
faer = { workspace = true }
kiddo = { workspace = true }
kornia-algebra = { workspace = true }
kornia-image = { workspace = true }
kornia-imgproc = { workspace = true }
log = { workspace = true }
nalgebra = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }
kornia-io = { workspace = true }
kornia-tensor = { workspace = true }

[features]
# CUDA-resident rectification: uploads the remap tables once and serves device frames through
# kornia-imgproc's residency-dispatched remap — see CudaStereoRectifier's doc for the
# CPU<->CUDA byte-exact contract
cuda = ["dep:cudarc", "kornia-image/cuda", "kornia-imgproc/cuda"]
