[package]
name = "kornia-oxide-kernels"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "kornia's CUDA kernels written in Rust, compiled to PTX by cuda-oxide"
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
categories = { workspace = true }
# A whitelist, so the generated `kernels.ptx` (gitignored) ships too; `device/`
# goes as sources only (its manifest is Cargo.toml.in so cargo keeps it).
include = [
  "build.rs",
  "device_src.rs",
  "ptx_gate.rs",
  "src/**",
  "tests/**",
  "examples/**",
  "device/Cargo.toml.in",
  "device/Cargo.lock",
  "device/rust-toolchain.toml",
  "device/src/**",
  "kernels.ptx",
]
publish = true

[features]
# Ship the prebuilt `kernels.ptx` (in the published crate; in a checkout, made by
# `examples/build_ptx.rs`, docs/cuda-oxide.md). Off: `PTX` is empty and
# `IS_STUB` is true.
ptx = []
